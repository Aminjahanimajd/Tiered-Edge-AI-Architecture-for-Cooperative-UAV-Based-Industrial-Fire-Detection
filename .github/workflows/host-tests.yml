name: Host tests and publication integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install host test dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: Portable tests
        run: python -m pytest tests -q
      - name: Publication hashes and numerical contracts
        run: python tools/verify_publication.py
